name: security-tests

# Runs on every pull request and on every push to the main branch.
# No OpenAI key is needed: the benchmark uses the scripted "fully tricked" model.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests and gate tests
        run: python -m pytest -v

      - name: Benchmark with the security gate
        run: >
          python -m runner.benchmark
          --model-mode scripted
          --repeats 3
          --max-attack-success 0
          --results-dir ci-results
      
      - name: Weakened policies must fail the gate
        run: |
          for p in no_taint narrow_taint no_redaction; do
            out=$(python -m runner.benchmark --model-mode scripted \
              --policy config/regressions/$p.yaml \
              --max-attack-success 0 --results-dir ci-results || true)
            echo "$out" | grep -q "GATE: FAIL" || { echo "Drill $p was NOT detected"; exit 1; }
          done

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence
          path: ci-results/
          if-no-files-found: ignore